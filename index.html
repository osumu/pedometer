<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MPU-6500 Cube with Three.js</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            font-family: sans-serif;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            color: white;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
</head>

<body>
    <div id="info">
        ピッチ（Y軸）: 0°, ロール（X軸）: 0°, ヨー（Z軸）: 0° <br><span id="temp">0.0°C</span>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshNormalMaterial();
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(0, 0, 5).normalize();
        scene.add(light);

        camera.position.set(0, 0, 5);
        camera.lookAt(0, 0, 0);

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        async function fetchData() {
            try {
                const res = await fetch('/data');
                const data = await res.json();
                const pitch = data.pitch || 0;
                const roll = data.roll || 0;
                const yaw = data.yaw || 0;
                const temp = data.temp || 0;

                const euler = new THREE.Euler(
                    pitch * Math.PI / 180,
                    roll * Math.PI / 180,
                    yaw * Math.PI / 180,
                    'ZYX'
                );
                cube.quaternion.setFromEuler(euler);

                document.getElementById('info').innerHTML =
                    `ピッチ（Y軸）: ${pitch.toFixed(1)}°, ロール（X軸）: ${roll.toFixed(1)}°, ヨー（Z軸）: ${yaw.toFixed(1)}° <br><span id="temp">${temp.toFixed(1)}°C</span>`;

                const tempSpan = document.getElementById('temp');
                if (temp >= 60) {
                    tempSpan.style.color = '#ff0000';
                } else if (temp >= 50) {
                    tempSpan.style.color = '#ff9900';
                } else if (temp >= 40) {
                    tempSpan.style.color = '#ffff00';
                } else {
                    tempSpan.style.color = '#ffffff';
                }

            } catch (e) {
                console.error("Data Acquisition Failure:", e);
            }
        }

        setInterval(fetchData, 100);
    </script>
</body>

</html>
