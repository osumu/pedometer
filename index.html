<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 万歩計（グラフ付き）</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            width: 90%;
            max-width: 450px;
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .counter {
            font-size: 56px;
            font-weight: bold;
            color: #2ed573;
            margin: 15px 0;
        }
        .counter span {
            font-size: 18px;
            color: #333;
        }
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin: 5px;
            transition: 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        .start-btn {
            background-color: #1e90ff;
            width: 100%;
            display: block;
            margin-bottom: 15px;
        }
        /* グラフエリアのスタイル */
        .chart-container {
            background-color: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 90%;
            max-width: 450px;
            box-sizing: border-box;
        }
        .chart-title {
            font-size: 16px;
            font-weight: bold;
            color: #555;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>HTML5 万歩計</h1>
    <button id="startBtn" class="start-btn">計測を開始する</button>

    <div class="counter">
        <span id="stepCount">0</span> <span>歩</span>
    </div>

    <button id="resetBtn">リセット</button>
</div>

<div class="chart-container">
    <div class="chart-title">過去7日間の歩数データ</div>
    <canvas id="stepChart"></canvas>
</div>

<script>
    let stepCount = 0;
    let isStep = false;
    const threshold = 11.5; 
    
    const stepCountDisplay = document.getElementById('stepCount');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    let myChart;

    // 今日（日付）の文字列を取得する関数 (例: "2026-05-26")
    function getTodayString() {
        const today = new Date();
        return today.toISOString().split('T')[0];
    }

    // データの保存（localStorage）
    function saveSteps() {
        const todayStr = getTodayString();
        localStorage.setItem(todayStr, stepCount);
        updateChart(); // グラフを更新
    }

    // データの読み込み
    function loadTodaySteps() {
        const todayStr = getTodayString();
        const savedSteps = localStorage.getItem(todayStr);
        if (savedSteps) {
            stepCount = parseInt(savedSteps, 10);
            stepCountDisplay.textContent = stepCount;
        }
    }

    // 過去7日間の日付とデータリストを生成する関数
    function getPast7DaysData() {
        const labels = [];
        const data = [];
        
        for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const dateStr = d.toISOString().split('T')[0];
            
            // グラフのラベル用 (例: "5/26")
            labels.push(`${d.getMonth() + 1}/${d.getDate()}`);
            
            // 該当日のデータを取得（なければ0）
            const steps = localStorage.getItem(dateStr) ? parseInt(localStorage.getItem(dateStr), 10) : 0;
            data.push(steps);
        }
        return { labels, data };
    }

    // グラフの初期化・更新
    function updateChart() {
        const chartData = getPast7DaysData();
        const ctx = document.getElementById('stepChart').getContext('2d');

        if (myChart) {
            // 既にグラフがあればデータを更新
            myChart.data.labels = chartData.labels;
            myChart.data.datasets[0].data = chartData.data;
            myChart.update();
        } else {
            // 初回作成
            myChart = new Chart(ctx, {
                type: 'bar', // 棒グラフ
                data: {
                    labels: chartData.labels,
                    datasets: [{
                        label: '歩数',
                        data: chartData.data,
                        backgroundColor: '#2ed573',
                        borderRadius: 8,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { stepSize: 2000 }
                        }
                    },
                    plugins: {
                        legend: { display: false } // 凡例は非表示
                    }
                }
            });
        }
    }

    // ボタンのイベント
    resetBtn.addEventListener('click', () => {
        if(confirm("本日の歩数をリセットしますか？")) {
            stepCount = 0;
            stepCountDisplay.textContent = stepCount;
            saveSteps();
        }
    });

    startBtn.addEventListener('click', () => {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission()
                .then(permissionState => {
                    if (permissionState === 'granted') {
                        startTracking();
                        startBtn.style.display = 'none';
                    }
                }).catch(console.error);
        } else {
            startTracking();
            startBtn.style.display = 'none';
        }
    });

    function startTracking() {
        window.addEventListener('devicemotion', (event) => {
            if (!event.accelerationIncludingGravity) return;

            const x = event.accelerationIncludingGravity.x || 0;
            const y = event.accelerationIncludingGravity.y || 0;
            const z = event.accelerationIncludingGravity.z || 0;
            const acceleration = Math.sqrt(x * x + y * y + z * z);

            if (acceleration > threshold) {
                if (!isStep) {
                    stepCount++;
                    stepCountDisplay.textContent = stepCount;
                    isStep = true;
                    saveSteps(); // 歩数が増えるたびにローカルに保存
                }
            } else if (acceleration < threshold - 2) {
                isStep = false;
            }
        });
    }

    // ページ読み込み時の処理
    window.onload = () => {
        loadTodaySteps();
        updateChart();
    };
</script>

</body>
</html>
